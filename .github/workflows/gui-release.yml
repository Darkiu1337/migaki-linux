name: GUI release

# Builds the gpui launcher and publishes it as the release asset install.sh
# downloads (migaki-gui-x86_64). Tag a release with `git tag gui-v1 && git push
# --tags` to publish; workflow_dispatch only produces a build artifact.
on:
  push:
    tags: ["gui-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-xkb-dev \
            libvulkan-dev libwayland-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Build
        working-directory: gui
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          install -m755 gui/target/release/migaki-gui dist/migaki-gui-x86_64
          strip dist/migaki-gui-x86_64
          ( cd dist && sha256sum migaki-gui-x86_64 > migaki-gui-x86_64.sha256 )
          ls -l dist

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/migaki-gui-x86_64
            dist/migaki-gui-x86_64.sha256

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/gui-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: migaki-gui-x86_64
          path: dist/
